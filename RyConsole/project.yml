name: RyConsole
options:
  bundleIdPrefix: com.research
  deploymentTarget:
    iOS: "16.0"
targets:
  RyConsole:
    type: application
    platform: iOS
    sources:
      # Widget 目录属于扩展 target：绝不能同时编进主 App（@main / ActivityConfiguration 会撞车）
      - path: PayloadApp
        excludes:
          - "Widget/**"
      - path: PayloadApp/AppIcon.xcassets
      - path: RyConsoleScripts
        buildPhase: resources
    dependencies:
      - target: RyConsoleWidget
    info:
      path: PayloadApp/Info.plist
      properties:
        MinimumOSVersion: "16.0"
        # ---- 版本号单一事实源（V2.3.0 起）：UI 左上角 / statusJSON / appInfo 都从 Bundle 读这里 ----
        # ★ 此前 UI 左上角是硬编码 @"v1.1"，Info.plist 里又没有版本键 → 永远显示 v1.1
        CFBundleShortVersionString: "2.4.27"
        CFBundleVersion: "67"
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSupportsIndirectInputEvents: true
        # ---- 渲染相关（缺了会"能装能开但看着不对"，且构建全绿）----
        # UILaunchScreen 缺失 → iPad 上按 iPhone 尺寸运行、四周黑边（永远拿不到 iPad 全屏分辨率）
        UILaunchScreen: {}
        # 方向：壳是左侧栏布局，竖横都支持；iPad 额外允许倒置
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ---- 网络：AI 后端 / 结果回传 ----
        # 线上 AI 接口多为 https，无需 ATS 例外；
        # 局域网（本地模型 / 代理 / 结果回传 如 192.168.x.x）需要下面两项。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 用于访问局域网内的研究桥接服务（结果回传、本地模型或代理）。只连接你本人的地址，不扫描他人网络。
        NSBonjourServices:
          - _http._tcp
          - _localsend._tcp
        # ---- 后台保活（V2.2）----
        # audio：Autorun 监听期间循环播放≈不可闻的极低幅度音频，进程不被挂起。
        #   这是 Info.plist 声明，个人开发者(自签)签名同样生效，无需额外 entitlement。
        # fetch：兜底，允许系统给后台拉取机会（不实现也不报错）。
        UIBackgroundModes:
          - audio
          - fetch
        # ---- 界面：进 App 后隐藏系统状态栏（时间/电量太挡）+ 由 plist 全局控制 ----
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        # ---- 实时活动（灵动岛 / 锁屏「监听中」）：必须显式声明，缺了 request 直接抛错 ----
        NSSupportsLiveActivities: true
        # ---- 合规：仅使用标准 https 加密，避免出口合规问询 ----
        ITSAppUsesNonExemptEncryption: false
        # ---- 允许从「文件」App 直接把探针脚本丢进来（热重载，不重编 IPA）----
        CFBundleDocumentTypes:
          - CFBundleTypeName: RyConsole Probe Script
            LSHandlerRank: Owner
            LSItemContentTypes:
              - com.netscape.javascript-source
              - public.json
              - public.plain-text
    settings:
      base:
        INFOPLIST_FILE: PayloadApp/Info.plist
        # ★ 必须显式关掉：Xcode 26 默认 GENERATE_INFOPLIST_FILE=YES 会自己生成一份，
        #    把我们手写的 ATS / NSLocalNetworkUsageDescription 等键静默吞掉（构建仍 SUCCESS）。
        GENERATE_INFOPLIST_FILE: "NO"
        PRODUCT_NAME: RyConsole
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        PRODUCT_BUNDLE_IDENTIFIER: com.research.ryconsole
        OTHER_LDFLAGS: "-framework UIKit -framework Foundation -framework JavaScriptCore -framework IOSurface -framework Security -framework IOKit -framework AVFoundation"
        # 主 target 现在含 Swift（LiveActivity.swift）→ 不设 SWIFT_VERSION 会直接构建报错
        SWIFT_VERSION: "5.0"

  # ---- 实时活动扩展：唯一能"画"灵动岛的地方（主 App 自己画不了）----
  RyConsoleWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "16.1"      # ActivityKit 起始版本；低于它会要求一堆 @available
    sources:
      - path: PayloadApp/Widget
      - path: PayloadApp/RyListenAttributes.swift   # 与主 App 共享的活动模型（两边各编一份）
      - path: PayloadApp/RyRemoteAttributes.swift   # 远程连接活动模型（与监听同规则，双 target 共享）
    info:
      path: PayloadApp/Widget/Info.plist
      properties:
        CFBundleDisplayName: RyConsole 监听
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: RyConsoleWidget
        PRODUCT_BUNDLE_IDENTIFIER: com.research.ryconsole.widget
        INFOPLIST_FILE: PayloadApp/Widget/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_ALLOWED: "NO"
        SKIP_INSTALL: "YES"
        SWIFT_VERSION: "5.0"
